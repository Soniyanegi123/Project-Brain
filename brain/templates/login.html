<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Project Brain</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-panel">
        <div class="brand-icon">B</div>
        <p class="eyebrow">PROJECT BRAIN</p>
        <h1>Sign in</h1>
        <p class="auth-copy">Enter the workspace access password.</p>
        {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_path }}">
            <label for="password">Access password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button class="button button-primary button-full" type="submit">Continue</button>
        </form>
    </main>
</body>
</html>
